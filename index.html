<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sidang Nalar</title>
<meta name="description" content="Game sidang bergaya Ace Attorney jadul untuk belajar teks diskusi kelas VIII.">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sidang Nalar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelify-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="game" id="game">
  <header class="hud">
    <div class="babak" id="babak">SIDANG NALAR</div>
    <div class="tools">
      <button class="mini" id="btnNote" type="button">CATATAN</button>
      <button class="mini" id="btnSound" type="button" aria-pressed="true">SUARA ON</button>
    </div>
    <div class="gauge-wrap">
      <span class="gauge-label">KEPERCAYAAN HAKIM</span>
      <div class="gauge" id="gauge" role="img" aria-label="Kepercayaan hakim 5 dari 5"></div>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Ruang sidang">
    <canvas id="bg" width="160" height="90"></canvas>
    <canvas id="portrait" width="64" height="64"></canvas>
    <canvas id="fg" width="160" height="90"></canvas>
    <div class="flash" id="flash" aria-hidden="true"><span></span></div>
    <div class="title" id="title">
      <p class="kick">PERKARA HARI INI</p>
      <h1>SIDANG<br>NALAR</h1>
      <p class="sub">Media sosial, sahabat atau jebakan bagi remaja? Uji argumennya dan timbang dua sisi.</p>
      <button class="btn press" id="btnStart" type="button">MULAI SIDANG</button>
    </div>
  </section>

  <section class="dialog" id="dialog" hidden role="button" tabindex="0" aria-label="Ketuk untuk melanjutkan">
    <div class="who" id="who"></div>
    <p class="text" id="text"></p>
    <span class="next" id="next" hidden></span>
  </section>

  <section class="actions" id="actions"></section>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetT" id="sheetPanel">
    <div class="sheet-head">
      <h2 id="sheetT">CATATAN SIDANG</h2>
      <button class="mini" id="btnClose" type="button">TUTUP</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="js/game.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
